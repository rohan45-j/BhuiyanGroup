version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhuiyan-group-portal
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount persistent upload and configuration directories
      - ./public/uploads:/app/public/uploads
      - ./src/data:/app/src/data
